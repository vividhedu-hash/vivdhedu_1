name: Weekly Data Scrape Pipeline

on:
  schedule:
    - cron: '30 20 * * 6'  # 02:00 IST Sunday
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no DB writes)'
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        source:
          - worldbank
          - plfs
          - nirf
          - payscale
          - naukri
          - internshala
          - indeed
          - reddit
          - college_placement
          - jina
          - tavily
          - crawl4ai
          - ambitionbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: 'IndiaLens/1.0 by u/indialens_bot'
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            EXTRA="--commit"
          fi
          python -m scripts.run_scrapers --only ${{ matrix.source }} $EXTRA

  post-scrape:
    needs: [scrape]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger ROI recompute
        if: github.event.inputs.dry_run != 'true'
        run: |
          curl -X POST "$API_BASE/api/v1/admin/recompute-roi" \
            -H "X-API-KEY: $API_KEY_ADMIN" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
        env:
          API_BASE: ${{ secrets.API_BASE_URL }}
          API_KEY_ADMIN: ${{ secrets.API_KEY_ADMIN }}
      - name: Notify on failure
        if: failure()
        run: echo "Weekly scrape pipeline had failures. Check GitHub Actions logs."
